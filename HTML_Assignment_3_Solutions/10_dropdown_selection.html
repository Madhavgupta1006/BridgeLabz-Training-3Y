<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Travel Selection</title></head>
<body>
  <h1>Choose Your Travel Preferences</h1>
  <form action="#" method="get">
    <label for="country">Country:</label>
    <select id="country" name="country">
      <option selected value="India">India</option><option value="Nepal">Nepal</option><option value="Japan">Japan</option>
    </select><br><br>
    <label for="state">State:</label>
    <select id="state" name="state">
      <option selected value="Uttar Pradesh">Uttar Pradesh</option><option value="Himachal Pradesh">Himachal Pradesh</option><option value="Rajasthan">Rajasthan</option>
    </select><br><br>
    <label for="city">City:</label>
    <select id="city" name="city">
      <option selected value="Mathura">Mathura</option><option value="Agra">Agra</option><option value="Jaipur">Jaipur</option>
    </select><br><br>
    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
      <option selected value="Taj Mahal">Taj Mahal</option><option value="Vrindavan">Vrindavan</option><option value="Hawa Mahal">Hawa Mahal</option>
    </select><br><br>
    <input type="submit" value="Submit Choices">
  </form>
  <p>My selected preferences are India, Uttar Pradesh, Mathura, and the Taj Mahal as my favorite tourist place.</p>
</body>
</html>
