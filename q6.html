<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - CSS Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            height: 250px;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .caption-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .caption-overlay span {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f1c40f;
            transform: translateY(15px);
            transition: transform 0.4s ease;
        }

        /* Hover Actions */
        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item:hover .caption-overlay {
            opacity: 1;
        }

        .gallery-item:hover .caption-overlay span {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>Responsive Photo Gallery</h1>

    <div class="gallery-grid">
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600" alt="Nature">
            <div class="caption-overlay"><span>Alpine Mountain Wilderness</span></div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Beach">
            <div class="caption-overlay"><span>Tropical Sunset Coastline</span></div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600" alt="Night Sky">
            <div class="caption-overlay"><span>Starlit Milky Way Galaxy</span></div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=600" alt="Forest">
            <div class="caption-overlay"><span>Misty Evergreen Forest</span></div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Canyon">
            <div class="caption-overlay"><span>Grand Canyon Panorama</span></div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1426604966848-d7adac902bff?w=600" alt="Waterfall">
            <div class="caption-overlay"><span>Hidden Jungle Waterfall</span></div>
        </div>
    </div>

</body>
</html>
